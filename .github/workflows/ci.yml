name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Pin Python
        run: uv python install ${{ matrix.python }}

      - name: Sync workspace
        run: uv sync --all-extras --all-packages

      - name: Ruff lint
        run: uv run ruff check backend/src backend/tests

      - name: Mypy
        run: uv run mypy --ignore-missing-imports backend/src
        continue-on-error: true  # mypy is advisory until orchestrator lands

      - name: Pytest
        working-directory: backend
        run: uv run pytest -q

      - name: Generate schemas
        working-directory: backend
        run: uv run python scripts/dump_schemas.py

      - name: Upload schemas artifact
        uses: actions/upload-artifact@v4
        with:
          name: quorum-schemas-py${{ matrix.python }}
          path: data/schemas/quorum.schema.json

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: TypeScript check
        working-directory: frontend
        run: pnpm exec tsc -b --noEmit

      - name: Test
        working-directory: frontend
        run: pnpm test

      - name: Build
        working-directory: frontend
        run: pnpm build
