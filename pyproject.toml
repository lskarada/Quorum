[project]
name = "quorum-workspace"
version = "0.1.0"
requires-python = ">=3.11,<3.13"

[tool.uv.workspace]
members = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's idiomatic `Depends(...)` in default args trips B008.
"backend/src/quorum/api/routes.py" = ["B008"]
# `MockX` is the conventional name for unittest.mock patch targets.
"backend/tests/test_mcp_tools.py" = ["N806"]
